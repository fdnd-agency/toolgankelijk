name: Toolgankelijk CI

on:
  push:
    branches: ['dev']
  pull_request:
    branches: ['dev']

env:
  DIRECTUS_URL: ${{ secrets.DIRECTUS_URL }}
  VITE_DIRECTUS_KEY: ${{ secrets.VITE_DIRECTUS_KEY }}
  TOOLGANKELIJK_AUDIT_URL: ${{ vars.TOOLGANKELIJK_AUDIT_URL }}
  SMTP_HOST: ''
  SMTP_PORT:
  SMTP_USER: ''
  SMTP_PASS: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'
      - run: npm i
      - run: npm test --if-present

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'
      - run: npm i
      - run: npm run lint --if-present
lighthouse:
  stage: test
  when: always
  image: node:22


  interruptible: true

  needs:
    - build

  before_script:
    - apt-get update && apt-get install -y chromium --no-install-recommends
    - npm install -g @lhci/cli serve

  script:
    - export CHROME_PATH=$(which chromium)
    - serve dist/web -p 8080 &
    - sleep 3
    - URLS=$(find dist/web -name "*.html" | sed 's|dist/web|http://localhost:8080|' | tr '\n' ' ')
    - echo "Gevonden pagina's: $URLS"
    - lhci autorun --collect.url=$URLS

  artifacts:
    paths:
      - .lighthouseci/

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual