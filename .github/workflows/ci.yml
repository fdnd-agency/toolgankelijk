name: Toolgankelijk CI

on:
  push:
    branches: ['dev']
  pull_request:
    branches: ['dev']

env:
  DIRECTUS_URL: ${{ secrets.DIRECTUS_URL }}
  DIRECTUS_STATIC_TOKEN: ${{ secrets.DIRECTUS_STATIC_TOKEN }}
  TOOLGANKELIJK_AUDIT_URL: ${{ vars.TOOLGANKELIJK_AUDIT_URL }}
  SMTP_HOST: ''
  SMTP_PORT:
  SMTP_USER: ''
  SMTP_PASS: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'
      - run: npm i
      - run: npm test --if-present

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: 'npm'
      - run: npm i
      - run: npm run lint --if-present
