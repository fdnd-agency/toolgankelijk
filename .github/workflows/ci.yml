name: Toolgankelijk CI

on:
  push:
    branches: ['dev']
  pull_request:
    branches: ['dev']

env:
  DIRECTUS_URL: ${{ secrets.DIRECTUS_URL }}
  VITE_DIRECTUS_KEY: ${{ secrets.VITE_DIRECTUS_KEY }}
  TOOLGANKELIJK_AUDIT_URL: ${{ vars.TOOLGANKELIJK_AUDIT_URL }}
  SMTP_HOST: ''
  SMTP_PORT: ''
  SMTP_USER: ''
  SMTP_PASS: ''

jobs:
  pipeline:
    name: Build, Test, Lint, and Audit
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code (using the current stable v4)
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js (using current stable v4 and Node 22)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Lint the code
      # - name: Run Linter
      #   run: npm run lint --if-present

      # 5. Run standard tests
      - name: Run Tests
        run: npm test --if-present

      # 6. Build the SvelteKit app
      - name: Build App
        run: npm run build

      # 7. Run Lighthouse CI 
      # (This relies on your .lighthouserc.json that we set up to use `npm run preview`)
      - name: Run Lighthouse
        run: npx lhci autorun

      # 8. Save the reports so you can view them later
      - name: Upload Lighthouse Reports
        uses: actions/upload-artifact@v4
        if: always() # Uploads the reports even if the Lighthouse score fails the pipeline
        with:
          name: lighthouse-results
          path: .lighthouseci/