name: Toolgankelijk CI

on:
  push:
    branches: ['dev']
  pull_request:
    branches: ['dev']

env:
  HYGRAPH_URL: ${{ secrets.HYGRAPH_URL }}
  VITE_HYGRAPH_KEY: ${{ secrets.VITE_HYGRAPH_KEY }}
  TOOLGANKELIJK_AUDIT_URL: ${{ vars.TOOLGANKELIJK_AUDIT_URL }}
  SMTP_HOST: ''
  SMTP_PORT:
  SMTP_USER: ''
  SMTP_PASS: ''
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build & Test & Lint
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
      - run: npm run lint
